name: Build Windows package

# Builds the portable Windows app + NSIS installer with the same
# build_package.sh used on a local Debian machine, but inside a Debian
# container so it can run in CI. Produces WhisperSubtitler_Setup.exe and
# WhisperSubtitler.zip; if a release tag is given they are attached to it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the built assets to (optional, e.g. v2.0)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package in Debian (mingw-w64 + wine + NSIS)
        run: |
          docker run --rm -v "$PWD:/work" -w /work debian:bookworm bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            dpkg --add-architecture i386
            apt-get update
            apt-get install -y \
              ca-certificates curl unzip file \
              mingw-w64 nsis nsis-common \
              python3 python3-pip \
              wine xvfb xauth

            # Wine needs an X server even for a silent msiexec extraction
            # (used to unpack tcltk.msi). Provide a transparent wrapper so
            # build_package.sh can call "wine" normally.
            printf "#!/bin/sh\nexec xvfb-run -a /usr/bin/wine \"\$@\"\n" > /usr/local/bin/wine
            chmod +x /usr/local/bin/wine

            export WINEARCH=win64
            export WINEDEBUG=-all
            export WINEDLLOVERRIDES="mscoree,mshtml="

            echo "== wine diagnostics =="
            xvfb-run -a /usr/bin/wine --version
            xvfb-run -a /usr/bin/wineboot -u || true

            echo "== DEBUG tcltk.msi =="
            curl -fsSL -o /tmp/tcltk.msi "https://www.python.org/ftp/python/3.11.9/amd64/tcltk.msi"
            apt-get install -y msitools >/dev/null 2>&1 || true
            rm -rf /tmp/msi && mkdir -p /tmp/msi
            ( cd /tmp/msi && msiextract /tmp/tcltk.msi ) || echo "msiextract exit=$?"
            echo "-- msiextract tree (top) --"
            find /tmp/msi -maxdepth 3 2>/dev/null | head -60 || true
            echo "-- wine msiexec attempt --"
            xvfb-run -a /usr/bin/wine msiexec /a "Z:\\tmp\\tcltk.msi" /qn "TARGETDIR=C:\\tcltk_extract" || echo "msiexec exit=$?"
            find /root/.wine/drive_c/tcltk_extract -maxdepth 3 2>/dev/null | head -60 || true

            ./build_package.sh
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhisperSubtitler-windows
          path: |
            WhisperSubtitler_Setup.exe
            WhisperSubtitler.zip
          if-no-files-found: warn

      - name: Attach assets to release
        if: ${{ (github.event_name == 'release') || (github.event.inputs.tag != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" WhisperSubtitler_Setup.exe WhisperSubtitler.zip --clobber
